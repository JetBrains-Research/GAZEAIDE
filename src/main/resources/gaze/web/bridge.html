<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Implicit — UnitEye gaze bridge</title>
  <style>
    html, body { margin: 0; background: #0d1117; color: #8b949e; font: 12px monospace; padding: 8px; }
  </style>
</head>
<body>
  <!--
    Headless bridge between the vendored UnitEye browser pipeline (uniteye-core.js /
    uniteye-cv.js, from https://github.com/wgnrto/uniteye, GPL-3.0) and the plugin's Java side.

    Served over http://127.0.0.1:<port>/ by UniteyeGazeService (getUserMedia needs a real HTTP
    origin — loopback counts as a secure context, but file:// and data: URLs do not, and cannot
    call getUserMedia at all).

    Protocol posted to window.implicitBridge(line), one line per call, mirroring the plain-text
    contract the plugin already speaks on the Java side:
      READY            tracker started sampling
      EYE <epochMs> <face:0|1> <leftEAR> <rightEAR>  separate eyelid observations
      OK <x> <y>       valid gaze sample, top-left-origin OS screen pixels
      BAD              blink, nonfinite sample or no face this frame — cancels pending dwell and restores code
      ERR <message>    fatal error -> plugin notifies and falls back to mouse
      STATUS <stage>   startup progress; Java enforces a deadline for each stage

    window.implicitBridge is injected by Java (UniteyeGazeService) via CefBrowser.executeJavaScript
    after the page loads. Since that happens well before the multi-second model/camera init below
    completes, the queue below is just cheap insurance against a theoretical race.
  -->
  <div id="status">starting…</div>
  <script>
    // Install before any dependencies: failed module imports must reach Java as well.
    function line(s) {
      if (typeof window.implicitBridge === 'function') window.implicitBridge(s);
      else (window.__implicitQueue = window.__implicitQueue || []).push(s);
    }
    window.addEventListener('error', event => {
      line('ERR ' + (event.message || 'Could not load a gaze script. Check internet access and retry.'));
    }, true);
    window.addEventListener('unhandledrejection', event => {
      line('ERR ' + (event.reason?.message || String(event.reason || 'Gaze runtime initialization failed.')));
    });
  </script>
  <script src="uniteye-core.js"></script>
  <script type="module">
    const statusEl = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const mock = params.get('mock') === '1';

    async function boot() {
      try {
        line('STATUS RUNTIME');
        const { UnitEyeWeb } = await import('./uniteye-cv.js');
        const engine = new UnitEyeWeb({
          mock,
          onStatus: stage => line('STATUS ' + stage),
          onEyeSample: s => line('EYE ' + s.atMonoMs + ' ' + (s.face ? 1 : 0) + ' ' + (Number.isFinite(s.left) ? s.left : -1) + ' ' + (Number.isFinite(s.right) ? s.right : -1)),
          modelUrl: 'models/eyemu.onnx',
          // Map gaze onto real OS screen pixels (what GazeDispatcher.routeScreenPoint expects),
          // not this hidden page's own viewport size.
          screenW: Number(params.get('screenW')) || window.screen.width,
          screenH: Number(params.get('screenH')) || window.screen.height,
          // Send raw EyeMU coordinates. Calibration and interaction filtering belong to Java.
          onGaze: (finalGaze, raw, blink, facePresent, features, atMonoMs) => {
            if (!facePresent || blink || !raw || !Number.isFinite(raw.x) || !Number.isFinite(raw.y)) { line('BAD'); return; }
            line('OK ' + Math.round(raw.x + (Number(params.get('screenX')) || 0)) + ' ' + Math.round(raw.y + (Number(params.get('screenY')) || 0)) + ' ' + atMonoMs);
          },
        });
        await engine.init();
        engine.start();
        window.__implicitEngine = engine;
        statusEl.textContent = 'running' + (mock ? ' (mock/mouse)' : ' (webcam)');
        line('READY');
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        statusEl.textContent = 'error: ' + msg;
        line('ERR ' + msg);
      }
    }

    boot();
  </script>
</body>
</html>
